<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ניהול אתרים</title>
    <meta name="manager-site-base" content="%BASE_PATH%" />
    <!-- Light is the default; dark is opt-in via the in-app toggle, so the
         OS preference must not drive form controls or the scrollbar. -->
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Heebo and Assistant include Hebrew. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Assistant:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="%BASE_PATH%/styles.css?v=%ASSET_VERSION%" />
    <link rel="stylesheet" href="%BASE_PATH%/links.css?v=%ASSET_VERSION%" />
    <link rel="stylesheet" href="%BASE_PATH%/interface.css?v=%ASSET_VERSION%" />
  </head>
  <body>
    <div id="app" class="boot-screen">
      <div class="current-mark" role="status" aria-label="טוען את סביבת העבודה"><i></i><i></i><i></i><i></i></div>
    </div>
    <script src="%BASE_PATH%/boot.js?v=%ASSET_VERSION%"></script>
    <script src="%BASE_PATH%/interface.js?v=%ASSET_VERSION%" defer></script>
    <script src="%BASE_PATH%/links.js?v=%ASSET_VERSION%" defer></script>
    <script src="%BASE_PATH%/app.js?v=%ASSET_VERSION%" defer></script>
    <!-- Pinned: @latest let a third party change the icon set under us. -->
    <script async src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  </body>
</html>
