<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ניהול אתרים</title>
    <meta name="manager-site-base" content="%BASE_PATH%" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Assistant (UI) and Frank Ruhl Libre (display) both ship full Hebrew.
         Archivo and IBM Plex Sans did not, so Hebrew set in them fell back to
         whatever the OS chose; both are dropped. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="%BASE_PATH%/styles.css?v=%ASSET_VERSION%" />
  </head>
  <body>
    <div id="app" class="boot-screen">
      <div class="mark">MS</div>
    </div>
    <script src="%BASE_PATH%/boot.js?v=%ASSET_VERSION%"></script>
    <script src="%BASE_PATH%/app.js?v=%ASSET_VERSION%" defer></script>
    <!-- Pinned: @latest let a third party change the icon set under us. -->
    <script async src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  </body>
</html>
